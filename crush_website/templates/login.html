<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Private ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3,
                    #c471ed
                );

            color: white;
        }

        .box {

            width: 90%;

            max-width: 400px;

            padding: 40px 30px;

            text-align: center;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.18);

            backdrop-filter:
                blur(15px);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 25px;
        }

        input {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            margin-bottom: 15px;

            font-size: 16px;

            outline: none;
        }

        button {

            padding:
                13px 25px;

            border: none;

            border-radius: 30px;

            background: white;

            color: #e84373;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .error {

            margin-top: 15px;

            color: #fff;

        }

    </style>

</head>

<body>

    <div class="box">

        <h1>
            🔐 Private Area
        </h1>

        <p>
            Only Varun can enter 😎
        </p>

        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <br>

            <button type="submit">
                Enter ❤️
            </button>

        </form>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

    </div>

</body>

</html>
